set -g default-terminal "screen"
set -g status-keys emacs
set -g mode-keys   emacs
set -g mouse on
set -g focus-events on
setw -g aggressive-resize on
setw -g clock-mode-style 24
set -s escape-time 0
set -g history-limit 5000

# start from 1 for easier binds
set -g base-index 1
set -g pane-base-index 1

# unbind default prefix
unbind C-b
set -g prefix None

# hide bar[
# set -g status off 

# allow passthrough so nvim can display images in terminal emulator
set -g allow-passthrough on

bind -n M-: command-prompt
bind -n M-z detach-client
bind -n M-p paste-buffer

bind -n M-c kill-pane
bind -n M-f resize-pane -Z

bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-t new-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# bind -n M-H resize-pane -L 4
# bind -n M-J resize-pane -D 4
# bind -n M-K resize-pane -U 4
# bind -n M-L resize-pane -R 4

setw -g mode-keys vi
bind -n M-y copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-[ send-keys -X cancel
