[General]
ConfigVersion=2
UseAtomicSaves=false
BackupBeforeSave=true
BackupFilePathPattern=../backup/{TIME}-{DB_FILENAME}-on-write-backup.kdbx

[GUI]
ApplicationTheme=classic
CompactMode=true
HideMenubar=true
HidePreviewPanel=false
HideToolbar=false
MinimizeOnClose=true
MinimizeOnStartup=true
ShowTrayIcon=true
TrayIconAppearance=monochrome-light

[PasswordGenerator]
AdvancedMode=true
Logograms=true
Type=1
WordSeparator=

[Security]
ClearClipboard=false
ClearSearch=true
LockDatabaseIdle=false

[SSHAgent]
Enabled=true

[FdoSecrets]
Enabled=true
